<!DOCTYPE html>
<html>
<head>
    <title>JEE Advanced Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>IIT DELHI</h1>
<h2>STABLE > SMART</h2>

<div class="card">
    <h3>Add Test Data</h3>
    <input type="number" id="score" placeholder="Score">
    <input type="number" id="attempted" placeholder="Attempted">
    <input type="number" id="correct" placeholder="Correct">
    <input type="number" id="changedWrong" placeholder="Wrong After Change">
    <button onclick="addTest()">Add Test</button>
</div>

<div class="card">
    <h3>Dashboard</h3>
    <p>Average Score: <span id="avgScore">0</span></p>
    <p>Accuracy: <span id="accuracy">0</span>%</p>
    <p>Status: <span id="status">Stable</span></p>
</div>

<script src="script.js"></script>
</body>
</html>
